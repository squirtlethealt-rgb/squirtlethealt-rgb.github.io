<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Gaganyatri Lens — ISRO 57th Anniversary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --saffron:#FF9933;
    --white:#FFFFFF;
    --green:#138808;
    --chakra:#0b1f6b;
    --glass:rgba(10,12,20,0.42);
    --glass-border:rgba(255,255,255,0.16); 
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;}
  .stage{position:fixed;inset:0;background:#000;touch-action:none;}

  /* --- CSS background layer (behind everything) --- */
  .bg-layer{position:absolute;inset:0;z-index:0;overflow:hidden;}
  .bg-layer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;animation:bgBreathe 12s ease-in-out infinite alternate;}
  @keyframes bgBreathe{0%{transform:scale(1);}100%{transform:scale(1.04);}}
  .bg-layer::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.65) 100%);pointer-events:none;z-index:1;}

  /* Camera feed kept alive for tracking but invisible */
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;background:#000;}
  canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);pointer-events:none;}
  canvas.dots{z-index:3;}

  .status-dot{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#777;z-index:12;box-shadow:0 0 8px #777;transition:background .25s,box-shadow .25s;}
  .status-dot.fitting{background:var(--saffron);box-shadow:0 0 8px var(--saffron);animation:blink 0.9s ease-in-out infinite;}
  .status-dot.locked{background:var(--green);box-shadow:0 0 8px var(--green);}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

  .top-bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;z-index:11;}
  .brand{width:32px;height:32px;animation:spin 9s linear infinite;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.6));}
  @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  .top-actions{display:flex;gap:10px;}

  .icon-btn{width:40px;height:40px;border-radius:50%;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;}
  .icon-btn svg{width:19px;height:19px;}
  .icon-btn.active{border-color:var(--saffron);color:var(--saffron);}
  .icon-btn:active{transform:scale(0.92);}

  .bottom-bar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:11;}
  .side-slot{width:50px;height:50px;display:flex;align-items:center;justify-content:center;}
  .thumb{width:100%;height:100%;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,0.7);background:#111;display:none;cursor:pointer;}
  .thumb img{width:100%;height:100%;object-fit:cover;}

  .shutter{width:74px;height:74px;border-radius:50%;padding:4px;cursor:pointer;background:conic-gradient(var(--saffron) 0 33%, var(--white) 33% 66%, var(--green) 66% 100%);}
  .shutter:active{transform:scale(0.94);}
  .shutter-inner{width:100%;height:100%;border-radius:50%;background:#fff;}

  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:15;opacity:0;pointer-events:none;transition:opacity .2s;}
  .sheet-backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#12141fee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px 20px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:16;border-top:2px solid var(--saffron);}
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;border-radius:3px;background:#444;margin:6px auto 14px;}
  .sheet-row{display:flex;align-items:center;gap:14px;padding:10px 0;}
  .sheet-row svg{width:20px;height:20px;flex:0 0 20px;color:#c7cae6;}
  .sheet-row input[type=range]{flex:1;accent-color:var(--saffron);}
  .toggle-row{display:flex;gap:10px;padding:8px 0 4px;}
  .toggle-row .icon-btn{background:#1c1f30;}

  .start-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%, #0d1230 0%, #000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;padding:24px;}
  .start-overlay.hidden{display:none;}

  /* --- Name prompt modal --- */
  .name-prompt{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:340px;width:100%;}
  .name-prompt h1{font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(16px,4.5vw,22px);color:var(--saffron);text-align:center;margin:0;letter-spacing:1px;text-transform:uppercase;line-height:1.3;}
  .name-prompt h1 span{display:block;font-size:clamp(11px,3vw,14px);color:rgba(255,255,255,0.7);font-family:'Outfit',sans-serif;font-weight:300;letter-spacing:0.5px;text-transform:none;margin-top:6px;}
  .name-prompt .isro-badge{width:72px;height:72px;border-radius:50%;padding:4px;background:conic-gradient(var(--saffron),var(--white) 33%,var(--white) 66%,var(--green));margin-bottom:4px;}
  .name-prompt .isro-badge-inner{width:100%;height:100%;border-radius:50%;background:#0a0c14;display:flex;align-items:center;justify-content:center;}
  .name-prompt .isro-badge-inner svg{width:28px;height:28px;color:#fff;}
  .name-input-wrap{width:100%;position:relative;}
  .name-input-wrap input{width:100%;padding:14px 18px;border-radius:14px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:16px 'Outfit',sans-serif;outline:none;transition:border-color .2s;}
  .name-input-wrap input::placeholder{color:rgba(255,255,255,0.35);}
  .name-input-wrap input:focus{border-color:var(--saffron);}
  .launch-btn{width:100%;padding:14px 0;border:none;border-radius:14px;background:linear-gradient(135deg, var(--saffron), #e67e22);color:#fff;font:600 16px 'Outfit',sans-serif;cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:transform .15s, opacity .15s;}
  .launch-btn:active{transform:scale(0.97);}
  .launch-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .launch-btn.loading{pointer-events:none;}

  .start-ring{width:84px;height:84px;border-radius:50%;padding:5px;background:conic-gradient(var(--saffron),var(--white) 33%,var(--white) 66%,var(--green));cursor:pointer;display:none;}
  .start-ring-inner{width:100%;height:100%;border-radius:50%;background:#0a0c14;display:flex;align-items:center;justify-content:center;color:#fff;}
  .start-ring-inner svg{width:32px;height:32px;}
  .start-ring.spinning .start-ring-inner svg{animation:spin 1s linear infinite;}
  .start-ring.err{background:conic-gradient(#ff6b4d,#ff6b4d);}
  .err-msg{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);left:20px;right:20px;text-align:center;color:#ff6b4d;font:13px/1.4 'Outfit',sans-serif;display:none;}
  .err-msg.show{display:block;}

  /* --- Text overlay (visible during AR session) --- */
  .text-overlay{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);z-index:10;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;opacity:0;transition:opacity .5s;}
  .text-overlay.visible{opacity:1;}
  .text-overlay .line1{font-family:'Orbitron',sans-serif;font-weight:700;font-size:clamp(11px,3.2vw,18px);color:var(--saffron);text-align:center;text-shadow:0 1px 8px rgba(0,0,0,0.8);letter-spacing:1.5px;text-transform:uppercase;padding:0 16px;}
  .text-overlay .line2{font-family:'Outfit',sans-serif;font-weight:400;font-size:clamp(13px,3.8vw,20px);color:#fff;text-align:center;text-shadow:0 1px 8px rgba(0,0,0,0.8);padding:0 16px;}
  .text-overlay .line2 em{font-style:normal;color:var(--saffron);font-weight:600;}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="bg-layer" id="bgLayer"><img src="bg.jpg.jpeg" alt="" id="bgImg"></div>
  <video id="video" playsinline webkit-playsinline autoplay muted></video>
  <canvas class="gl" id="glCanvas"></canvas>
  <canvas class="dots" id="dotsCanvas"></canvas>

  <div class="status-dot" id="statusDot"></div>

  <div class="top-bar">
    <svg class="brand" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="50" cy="50" r="44" fill="none" stroke="#0b1f6b" stroke-width="5"/>
      <circle cx="50" cy="50" r="5" fill="#0b1f6b"/>
      <g stroke="#0b1f6b" stroke-width="2.6">
        <line x1="50" y1="6" x2="50" y2="94"/><line x1="6" y1="50" x2="94" y2="50"/>
        <line x1="12.9" y1="12.9" x2="87.1" y2="87.1"/><line x1="12.9" y1="87.1" x2="87.1" y2="12.9"/>
        <line x1="24" y1="4.5" x2="76" y2="95.5"/><line x1="76" y1="4.5" x2="24" y2="95.5"/>
        <line x1="4.5" y1="24" x2="95.5" y2="76"/><line x1="4.5" y1="76" x2="95.5" y2="24"/>
        <line x1="34" y1="1.5" x2="66" y2="98.5"/><line x1="66" y1="1.5" x2="34" y2="98.5"/>
        <line x1="1.5" y1="34" x2="98.5" y2="66"/><line x1="1.5" y1="66" x2="98.5" y2="34"/>
      </g>
    </svg>
    <div class="top-actions">
      <button class="icon-btn active" id="flipBtn" aria-label="flip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </button>
      <button class="icon-btn active" id="dotsBtn" aria-label="tracking marks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="helmetBtn" aria-label="open or close the visor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13a8 8 0 0 1 16 0v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 13h16"/></svg>
      </button>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="side-slot">
      <button class="icon-btn" id="recalBtn" aria-label="recalibrate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-9.36L1 10"/></svg>
      </button>
    </div>
    <div class="shutter" id="snapBtn"><div class="shutter-inner"></div></div>
    <div class="side-slot">
      <div class="thumb" id="thumb"><img id="thumbImg" alt=""></div>
    </div>
  </div>

  <div class="text-overlay" id="textOverlay">
    <div class="line1" id="textLine1">Happy 57th Anniversary of ISRO 🚀</div>
    <div class="line2" id="textLine2"></div>
  </div>

  <div class="start-overlay" id="status">
    <div class="name-prompt" id="namePrompt">
      <div class="isro-badge">
        <div class="isro-badge-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>
      </div>
      <h1>Gaganyatri Lens<span>Celebrating 57 Years of ISRO — 15 August 2026</span></h1>
      <div class="name-input-wrap">
        <input type="text" id="nameInput" placeholder="Enter your name" autocomplete="off" maxlength="30">
      </div>
      <button class="launch-btn" id="launchBtn" disabled>Launch Camera 🛸</button>
    </div>
    <div class="start-ring" id="startBtn">
      <div class="start-ring-inner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
    </div>
    <div class="err-msg" id="errMsg"></div>
  </div>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-row">
    <!-- Zoom of the face to fit in the helmet -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    <input type="range" id="rFine" min="0.5" max="2" step="0.01" value="1">
  </div>
  <div class="sheet-row">
    <!-- Depth of suit position (Change to fit in the screen if needed or for the body face readjustment) Suits comes forward and backward due to this--> 
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 0 20"/><path d="M12 2a15.3 15.3 0 0 0 0 20"/></svg>
    <input type="range" id="rDepth" min="-40" max="40" step="0.5" value="0">
  </div>
  <div class="sheet-row">
    <!-- Height of suit position (Change to fit in the screen if needed or for the body face readjustment)--> 
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    <input type="range" id="rHeight" min="-120" max="120" step="0.5" value="-12">
  </div>
  <div class="sheet-row">
    <!-- Tilt of suit (Change if the helmet is tilted to one side Not recommended to configure)--> 
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3.5-7.1"/><polyline points="21 3 21 9 15 9"/></svg>
    <input type="range" id="rTilt" min="-45" max="45" step="1" value="0">
  </div>
  <div class="toggle-row">
    <button class="icon-btn active" id="envBtn" aria-label="virtual environment">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    </button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

const SUIT_URL = './Advanced_Crew_Escape_Suit.glb';
const SCALE_BOOST = 1.0;
const METERS_TO_SCENE_UNITS = 100;
const DEFAULT_FLIP = true;

// VIRTUAL_ZOOM scales down the entire avatar (both the 2D face cutout and the 
// 3D suit) on the screen so it doesn't take up the entire view when the user 
// holds the camera close to their face.
const VIRTUAL_ZOOM = 0.65;

const POSE_X_SIGN = 1;
const POSE_Y_SIGN = -1;
const POSE_Z_SIGN = -1;

const HAND_X_SIGN = 1;
const HAND_Y_SIGN = -1;
const HAND_Z_SIGN = -1;

const video = document.getElementById('video');
const glCanvas = document.getElementById('glCanvas');
const dotsCanvas = document.getElementById('dotsCanvas');
const dotsCtx = dotsCanvas.getContext('2d');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const errMsg = document.getElementById('errMsg');
const statusDot = document.getElementById('statusDot');
const snapBtn = document.getElementById('snapBtn');
const thumb = document.getElementById('thumb');
const thumbImg = document.getElementById('thumbImg');
const flipBtn = document.getElementById('flipBtn');
const dotsBtn = document.getElementById('dotsBtn');
const settingsBtn = document.getElementById('settingsBtn');
const helmetBtn = document.getElementById('helmetBtn');
const recalBtn = document.getElementById('recalBtn');
const sheet = document.getElementById('sheet');
const sheetBackdrop = document.getElementById('sheetBackdrop');
const poseRetargetBtn = document.getElementById('poseRetargetBtn');
const envBtn = document.getElementById('envBtn');
const rFine = document.getElementById('rFine');
const rDepth = document.getElementById('rDepth');
const rHeight = document.getElementById('rHeight');
const rTilt = document.getElementById('rTilt');

let showDots = true;
let poseRetargetEnabled = true;
let flip180 = DEFAULT_FLIP;
let envEnabled = true;

// Visor open/close: We use a 3D face card (plane) placed inside the helmet 
// with a VideoTexture. We dynamically crop it using FaceLandmarker points.
let helmetMeshes = [];
let visorStencilMeshes = [];
let helmetRemoved = false;
let faceCardMesh = null;
let faceTexture = null;
let headProxy = null;

// Standard MediaPipe face-mesh "face oval" landmark loop (ordered so
// consecutive indices trace the outline), used to build the clip box.
const FACE_OVAL_LOOP = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
// How far the visible cutout is grown beyond the raw face-oval landmarks,
// scaled outward from the oval's own centroid -- see drawFaceCutout().
// 1.0 = exactly the landmark outline (was clipping right at the jaw/
// hairline edge). Kept modest so it still reads as "your face", not a
// big flat patch of video pasted over the helmet.
const FACE_CUTOUT_EXPAND = 1.18;

let faceLandmarker = null;
let trackingReady = false;
let usingFallback = false;
let lastMatrixData = null;
let lastFaceLandmarks = null;
let renderer, scene, camera, maskGroup;
let envGroup = null;
let envPanels = [];
// Smoothed environment parallax rotation, driven by head yaw/pitch --
// see updatePlacementAndPose(). Kept separate from envGroup.rotation
// itself so we can lerp toward a target each frame instead of snapping.
let smoothedEnvYaw = 0;
let smoothedEnvPitch = 0;
const PARALLAX_YAW = 0.32;   // how much env rotation per radian of head yaw
const PARALLAX_PITCH = 0.22; // how much env rotation per radian of head pitch
const PARALLAX_SMOOTH = 0.08; // lerp factor per frame -- lower = dreamier/slower
let bones = null;
let bonesReady = false;
let restShoulderWidth = null;
let smoothedScale = null;
let headBindLocalQuat = null; // bind-pose LOCAL rotation of the Head bone, cached once at load
const MIN_LIVE_SHOULDER_M = 0.15;
const MAX_LIVE_SHOULDER_M = 0.65;
let manualOffset = {x:0, y:0};
let suitLoadFailed = false;
const CHEEK_L = 234, CHEEK_R = 454;
const MARK_POINTS = [234, 454, 1, 152, 10, 33, 263];

// Tracking variables removed for procedural animations
let dragging = false, dragStart = {x:0,y:0};
let cameraStarted = false;
let userName = '';

const nameInput = document.getElementById('nameInput');
const launchBtn = document.getElementById('launchBtn');
const namePrompt = document.getElementById('namePrompt');
const textOverlay = document.getElementById('textOverlay');
const textLine2 = document.getElementById('textLine2');

nameInput.addEventListener('input', () => {
  launchBtn.disabled = nameInput.value.trim().length === 0;
});
nameInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && nameInput.value.trim()) launchBtn.click();
});

launchBtn.addEventListener('click', () => {
  userName = nameInput.value.trim();
  if(!userName) return;
  textLine2.innerHTML = `I am <em>${userName}</em>, a future Vyomnaut`;
  launchBtn.classList.add('loading');
  launchBtn.textContent = 'Initializing…';
  namePrompt.style.display = 'none';
  startBtn.style.display = 'block';
  startBtn.classList.add('spinning');
  cameraStarted = true;
  startCamera();
});

function setViewfinderAspect(w, h){
  dotsCanvas.width = w;
  dotsCanvas.height = h;
}

startBtn.addEventListener('click', ()=>{
  if(cameraStarted) return;
  cameraStarted = true;
  startBtn.classList.add('spinning');
  startCamera();
});

async function startCamera(){
  try{
    const isMobile = window.innerWidth < window.innerHeight;
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'user',
        width: { ideal: isMobile ? 720 : 1280 },
        height: { ideal: isMobile ? 1280 : 720 }
      },
      audio: false
    });
    video.srcObject = stream;
    await new Promise(res=> video.onloadedmetadata = res);
    await video.play();
    setViewfinderAspect(video.videoWidth, video.videoHeight);
    initThree();
    await Promise.all([loadTracking(), loadSuit()]);

    if(suitLoadFailed){
      startBtn.classList.remove('spinning');
      startBtn.classList.add('err');
      errMsg.textContent = 'Suit model failed to load, or the expected skeleton bones were missing — check SUIT_URL / that this is the rigged export.';
      errMsg.classList.add('show');
      cameraStarted = false;
      return;
    }

    statusEl.classList.add('hidden');
    // Show the text overlay with a slight delay for a nice entrance
    setTimeout(() => textOverlay.classList.add('visible'), 400);
    requestAnimationFrame(loop);
  }catch(err){
    console.error(err);
    startBtn.classList.remove('spinning');
    startBtn.classList.add('err');
    errMsg.textContent = 'Camera permission denied or unavailable.';
    errMsg.classList.add('show');
    cameraStarted = false;
  }
}

function initThree(){
  renderer = new THREE.WebGLRenderer({ canvas: glCanvas, alpha:true, antialias:true, stencil:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.75));
  renderer.setSize(video.videoWidth, video.videoHeight, false);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(63, video.videoWidth/video.videoHeight, 1, 6000);
  camera.position.set(0,0,0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2a2a, 1.2));
  const dir = new THREE.DirectionalLight(0xffffff, 1.5);
  dir.position.set(0, 80, 150);
  scene.add(dir);
  const fill = new THREE.DirectionalLight(0xfff2d9, 0.6);
  fill.position.set(-100, 40, -80);
  scene.add(fill);

  maskGroup = new THREE.Group();
  maskGroup.matrixAutoUpdate = false;
  scene.add(maskGroup);

  // Background is now a CSS layer, no Three.js env geometry needed.
  // Just make sure the scene itself is transparent so the CSS bg shows through.
  envGroup = new THREE.Group();
  envPanels = [];
  scene.add(envGroup);
}

// Background is now a CSS layer behind the canvas. No Three.js env needed.
const bgLayer = document.getElementById('bgLayer');

function updateEnvironment(timeSec){
  if(bgLayer) bgLayer.style.display = envEnabled ? '' : 'none';
}

async function loadTracking(){
  let filesetResolver;
  try{
    filesetResolver = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU"
      },
      outputFaceBlendshapes: false,
      outputFacialTransformationMatrixes: true,
      runningMode: "VIDEO",
      numFaces: 1
    });
    trackingReady = true;
  }catch(e){
    usingFallback = true;
    enableDragFallback();
    return;
  }


}

function loadSuit(){
  return new Promise((resolve)=>{
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    dracoLoader.setDecoderConfig({ type: 'wasm' });

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);
    loader.setCrossOrigin('anonymous');
    loader.load(SUIT_URL, (gltf)=>{
      const root = gltf.scene;
      // Every "aceshelme"-family mesh we find while traversing -- the
      // helmet on this suit is authored as three separate primitives
      // sharing that material family: the outer shell, the neck ring, and
      // the visor pane. We collect all three here and sort out which one
      // is actually the visor afterward (see below), instead of treating
      // the whole family as one "helmet" blob -- opening the visor should
      // leave the shell and neck ring in place, not remove the helmet
      // entirely.
      const helmetFamily = [];
      root.traverse(o=>{
        if(o.isMesh){
          o.frustumCulled = false;
          // The suit's interior lining ("ACES_INTERIOR...") is authored
          // double-sided in the source file -- normal for an interior
          // surface, since it's only meant to be seen if you look inside a
          // sleeve/collar. But any residual sub-pixel gap at a skin-blend
          // seam (see poseShoulder()) lets the camera see straight through
          // to it, and because it renders both faces that reads as a
          // glaring flash of navy instead of just... not being there.
          // Forcing FrontSide here doesn't touch the source file or the
          // skinning at all -- it just stops that one interior surface
          // from drawing its backfaces, so a stray gap shows background
          // through it instead of bright blue.
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          for(const mat of mats){
            if(!mat || !mat.name) continue;
            const n = mat.name.toLowerCase();
            if(n.includes('interior')){
              mat.side = THREE.FrontSide;
            }
            if(n.includes('aceshelme') && !helmetFamily.some(h=>h.mesh===o)){
              const c = mat.color;
              // Perceived brightness of this primitive's base color. On
              // this GLB the visor is authored essentially black (tinted
              // glass) while the shell is near-white and the neck ring is
              // mid-grey -- confirmed by inspecting the file's material
              // list directly. Picking the visor out by brightness (not
              // by name suffix, which can shift across re-exports) is
              // what lets "open visor" hide only the glass pane.
              const brightness = c ? (c.r + c.g + c.b) / 3 : 1;
              helmetFamily.push({ mesh: o, brightness });
            }
          }
        }
      });
      // Only the meshes authored near-black are treated as the visor. A
      // hard threshold (rather than always taking the single darkest
      // entry) means that if this suit is ever re-exported with a
      // lighter-tinted visor, or the visor turns out to be more than one
      // primitive, we still fail safe -- worst case nothing opens, rather
      // than accidentally hiding the shell or neck ring by mistake.
      helmetMeshes = helmetFamily.filter(h => h.brightness < 0.2).map(h => h.mesh);
      // Store original materials so we can toggle between opaque and
      // semi-transparent (tinted glass) instead of fully hiding the visor.
      for(const m of helmetMeshes){
        const mats = Array.isArray(m.material) ? m.material : [m.material];
        for(const mat of mats){
          mat._origOpacity = mat.opacity;
          mat._origTransparent = mat.transparent;
        }
      }

      // --- Build a stencil mask from the visor mesh(es) ---
      // The face video card is a flat quad; it never matched the visor's
      // actual (rounded/angled) opening, so it showed up as a hard-edged
      // rectangle floating inside the helmet. Instead of trying to hand-
      // shape a mesh to match, we clone the *real* visor geometry -- same
      // skinning, same parent, so it moves identically -- and use it purely
      // to stamp a 1 into the stencil buffer wherever the visor itself
      // would be drawn (colorWrite/depthWrite both off, so it's invisible
      // on its own). The face card is then only allowed to draw where that
      // stencil value is set, which trims it to the visor's exact on-screen
      // silhouette no matter its shape.
      visorStencilMeshes = helmetMeshes.map(visorMesh=>{
        const maskMesh = visorMesh.clone();
        const stencilMat = new THREE.MeshBasicMaterial({ colorWrite:false, depthWrite:false });
        stencilMat.stencilWrite = true;
        stencilMat.stencilRef = 1;
        stencilMat.stencilFunc = THREE.AlwaysStencilFunc;
        stencilMat.stencilZPass = THREE.ReplaceStencilOp;
        stencilMat.stencilFail = THREE.KeepStencilOp;
        stencilMat.stencilZFail = THREE.KeepStencilOp;
        maskMesh.material = stencilMat;
        maskMesh.frustumCulled = false;
        maskMesh.renderOrder = 5; // must draw (and write stencil) before the face card below
        visorMesh.parent.add(maskMesh);
        return maskMesh;
      });

      bones = {};
      root.traverse(o=>{
        if(o.isBone){
          const shortName = o.name.replace(/^mixamorig:?/, '');
          bones[shortName] = o;
        }
      });

      if(!bones['Head'] || !bones['Hips'] || !bones['LeftArm'] || !bones['RightArm']){
        console.error('Expected mixamorig bones not found on this GLB — is SUIT_URL pointing at the rigged export?');
        suitLoadFailed = true;
        dracoLoader.dispose();
        resolve();
        return;
      }

      root.updateMatrixWorld(true);
      const headPos = new THREE.Vector3();
      bones['Head'].getWorldPosition(headPos);
      root.position.sub(headPos);
      root.updateMatrixWorld(true);

      // Cache the Head bone's bind-pose LOCAL rotation. Needed by the
      // root-rotation split in updatePlacementAndPose(): the face-tracked
      // pitch/roll (nodding, tilting) is applied ONLY to this bone, on top
      // of its own bind pose, instead of to the whole root/body.
      if(bones['Head']){
        headBindLocalQuat = bones['Head'].quaternion.clone();
      }


      // Cache the base rotations after setting the A-pose so the procedural animation
      // can oscillate around them.
      for (const name of ['LeftShoulder','RightShoulder','LeftArm','RightArm','LeftForeArm','RightForeArm','LeftHand','RightHand']) {
        if (bones[name]) {
          bones[name].userData.baseQuat = bones[name].quaternion.clone();
        }
      }

      maskGroup.add(root);
      
      // --- Create the 3D Face Card ---
      // Use VideoTexture with UV cropping (hardware accelerated, highly robust)
      faceTexture = new THREE.VideoTexture(video);
      faceTexture.wrapS = THREE.ClampToEdgeWrapping;
      faceTexture.wrapT = THREE.ClampToEdgeWrapping;
      faceTexture.colorSpace = THREE.SRGBColorSpace;
      
      // Explicitly disable flipY so texture V=0 maps to the TOP of the video, matching MediaPipe's Y=0
      faceTexture.flipY = false;
      
      const faceCardMat = new THREE.MeshBasicMaterial({ 
        map: faceTexture,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      // Only draw the face texture where the visor stencil mask above has
      // written a 1 -- this is what actually trims the video feed to the
      // helmet's real visor-opening contour instead of a plain rectangle.
      faceCardMat.stencilWrite = true;
      faceCardMat.stencilRef = 1;
      faceCardMat.stencilFunc = THREE.EqualStencilFunc;
      faceCardMat.stencilFail = THREE.KeepStencilOp;
      faceCardMat.stencilZFail = THREE.KeepStencilOp;
      faceCardMat.stencilZPass = THREE.KeepStencilOp;
      
      // Use a CylinderGeometry to curve the face card!
      // radius=0.5, height=1, 32 segments, openEnded=true, thetaStart=-30deg, thetaLength=60deg
      const faceGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 32, 1, true, -Math.PI/6, Math.PI/3);
      faceCardMesh = new THREE.Mesh(faceGeo, faceCardMat);
      
      // Instead of guessing the Head bone's internal axes, we attach it to a proxy group
      // directly inside maskGroup, which has standard predictable axes (+Y up, +Z forward).
      headProxy = new THREE.Group();
      maskGroup.add(headProxy);
      
      // Position the face card slightly forward (and slightly up if needed) from the neck joint
      // 0.18 units forward to ensure it clears the suit's interior meshes.
      faceCardMesh.position.set(0, 0.08, 0.18);
      faceCardMesh.visible = helmetRemoved;
      faceCardMesh.renderOrder = 10; // draw after the stencil mask (renderOrder 5) so the test applies
      
      headProxy.add(faceCardMesh);

      for(const m of helmetMeshes) m.visible = !helmetRemoved;
      bonesReady = true;
      dracoLoader.dispose();
      resolve();
    }, undefined, (err)=>{
      console.error('suit load failed', err);
      suitLoadFailed = true;
      dracoLoader.dispose();
      resolve();
    });
  });
}

function enableDragFallback(){
  glCanvas.style.pointerEvents = 'auto';
  const start = (x,y)=>{ dragging = true; dragStart = {x,y, ox:manualOffset.x, oy:manualOffset.y}; };
  const move = (x,y)=>{
    if(!dragging) return;
    manualOffset.x = dragStart.ox + (x - dragStart.x) * 0.4;
    manualOffset.y = dragStart.oy - (y - dragStart.y) * 0.4;
  };
  glCanvas.addEventListener('pointerdown', e=> start(e.clientX, e.clientY));
  window.addEventListener('pointermove', e=> move(e.clientX, e.clientY));
  window.addEventListener('pointerup', ()=> dragging = false);
}

function updateZeroGAnimation(timeSec) {
  if (!bonesReady) return;

  // Gentle full-body bob (very subtle translation)
  if (bones['Hips']) {
    bones['Hips'].position.y = Math.sin(timeSec * 1.5) * 0.015; 
  }

  // Left Arm Float
  if (bones['LeftArm'] && bones['LeftArm'].userData.baseQuat) {
    const q = bones['LeftArm'].userData.baseQuat.clone();
    const swingZ = Math.sin(timeSec * 1.2) * 0.08;
    const swingX = Math.cos(timeSec * 0.9) * 0.05;
    q.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(swingX, 0, swingZ)));
    bones['LeftArm'].quaternion.copy(q);
    bones['LeftArm'].updateWorldMatrix(true, false);
  }

  // Left ForeArm (bend)
  if (bones['LeftForeArm'] && bones['LeftForeArm'].userData.baseQuat) {
    const q = bones['LeftForeArm'].userData.baseQuat.clone();
    const bend = (Math.sin(timeSec * 1.5 + 1) * 0.5 + 0.5) * 0.15; // 0 to 0.15 rad
    q.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, bend, 0)));
    bones['LeftForeArm'].quaternion.copy(q);
    bones['LeftForeArm'].updateWorldMatrix(true, false);
  }

  // Left Hand (wrist float)
  if (bones['LeftHand'] && bones['LeftHand'].userData.baseQuat) {
    const q = bones['LeftHand'].userData.baseQuat.clone();
    const wristRoll = Math.sin(timeSec * 2.1) * 0.1;
    q.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(wristRoll, 0, 0)));
    bones['LeftHand'].quaternion.copy(q);
    bones['LeftHand'].updateWorldMatrix(true, false);
  }

  // Right Arm Float (offset phase)
  if (bones['RightArm'] && bones['RightArm'].userData.baseQuat) {
    const q = bones['RightArm'].userData.baseQuat.clone();
    const swingZ = Math.sin(timeSec * 1.3 + Math.PI) * 0.08; 
    const swingX = Math.cos(timeSec * 1.0 + Math.PI) * 0.05;
    q.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(swingX, 0, swingZ)));
    bones['RightArm'].quaternion.copy(q);
    bones['RightArm'].updateWorldMatrix(true, false);
  }

  // Right ForeArm (bend)
  if (bones['RightForeArm'] && bones['RightForeArm'].userData.baseQuat) {
    const q = bones['RightForeArm'].userData.baseQuat.clone();
    const bend = (Math.sin(timeSec * 1.4 + 2) * 0.5 + 0.5) * 0.15;
    q.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, -bend, 0)));
    bones['RightForeArm'].quaternion.copy(q);
    bones['RightForeArm'].updateWorldMatrix(true, false);
  }

  // Right Hand (wrist float)
  if (bones['RightHand'] && bones['RightHand'].userData.baseQuat) {
    const q = bones['RightHand'].userData.baseQuat.clone();
    const wristRoll = Math.sin(timeSec * 2.0 + 1) * 0.1;
    q.multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(-wristRoll, 0, 0)));
    bones['RightHand'].quaternion.copy(q);
    bones['RightHand'].updateWorldMatrix(true, false);
  }
}

function updatePlacementAndPose(){
  const fine = parseFloat(rFine.value);
  const depth = parseFloat(rDepth.value);
  const height = parseFloat(rHeight.value);
  const tilt = THREE.MathUtils.degToRad(parseFloat(rTilt.value));

  const base = new THREE.Matrix4();
  let headResidualQuat = null;

  if(trackingReady && lastMatrixData){
    const faceMat = new THREE.Matrix4().fromArray(lastMatrixData);
    const facePos = new THREE.Vector3();
    const faceQuat = new THREE.Quaternion();
    const faceScale = new THREE.Vector3();
    faceMat.decompose(facePos, faceQuat, faceScale);

    const faceEuler = new THREE.Euler().setFromQuaternion(faceQuat, 'YXZ');
    const yawOnlyQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, faceEuler.y, 0, 'YXZ'));
    headResidualQuat = yawOnlyQuat.clone().invert().multiply(faceQuat);

    base.compose(facePos, yawOnlyQuat, new THREE.Vector3(1,1,1));

    // Parallax: nudge the CSS background opposite the head's yaw/pitch.
    // Translates the bg-layer image so turning your head reveals more of
    // the background in that direction.
    if(bgLayer && envEnabled){
      const targetYaw = faceEuler.y * 18;   // px of shift per radian
      const targetPitch = faceEuler.x * 12;
      smoothedEnvYaw += (targetYaw - smoothedEnvYaw) * PARALLAX_SMOOTH;
      smoothedEnvPitch += (targetPitch - smoothedEnvPitch) * PARALLAX_SMOOTH;
      bgLayer.style.transform = `translate(${smoothedEnvYaw}px, ${smoothedEnvPitch}px)`;
    }
  } else {
    base.compose(
      new THREE.Vector3(manualOffset.x, manualOffset.y, -300),
      new THREE.Quaternion(),
      new THREE.Vector3(1,1,1)
    );
  }

  statusDot.className = trackingReady && lastMatrixData ? 'status-dot locked' : 'status-dot fitting';

  // Without the live shoulder-width tracking, we hardcode a reasonable baseline scale 
  // (0.45) to match the previous average so the suit matches the face cutout.
  const baseScale = 0.45;
  // Apply VIRTUAL_ZOOM to shrink the 3D suit in sync with the 2D face cutout
  const finalScale = baseScale * SCALE_BOOST * fine * METERS_TO_SCENE_UNITS * VIRTUAL_ZOOM;
  const flipYaw = flip180 ? Math.PI : 0;
  const calib = new THREE.Matrix4();
  calib.compose(
    new THREE.Vector3(0, height, depth),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(tilt, flipYaw, 0)),
    new THREE.Vector3(finalScale, finalScale, finalScale)
  );
  
  // Apply VIRTUAL_ZOOM to the translation so the suit moves towards the center of the screen
  const zoomedBase = base.clone();
  zoomedBase.elements[12] *= VIRTUAL_ZOOM; // x translation
  zoomedBase.elements[13] *= VIRTUAL_ZOOM; // y translation

  maskGroup.matrix.copy(zoomedBase).multiply(calib);
  maskGroup.matrixWorldNeedsUpdate = true;
  maskGroup.updateMatrixWorld(true);

  if(bonesReady && bones['Head'] && headBindLocalQuat && headResidualQuat){
    // headResidualQuat is a WORLD-space delta ("how much more than the
    // yaw-only body the head has turned"). It's tempting to just post-
    // multiply it onto the Head bone's bind-pose LOCAL rotation, but that
    // silently assumes Head's parent chain (Neck -> Spine -> Hips) has
    // zero rotation of its own -- on this rig each of those bones carries
    // its own non-identity bind-pose orientation. Skipping them baked in
    // a fixed skew between the 3D head/visor and the real tracked face,
    // which grew more visible the more the head tilted (the diagonal
    // drift between the face cutout and the visor opening).
    // Reading the Head bone's ACTUAL current parent world rotation (Neck's
    // world quat, which already reflects the yaw-only body transform PLUS
    // every intermediate bind-pose rotation, since none of those bones are
    // touched elsewhere) gives the real baseline to build on instead of
    // assuming it's just the body's yaw.
    const headParentWorldQuat = new THREE.Quaternion();
    bones['Head'].parent.getWorldQuaternion(headParentWorldQuat);
    const headBaselineWorldQuat = headParentWorldQuat.clone().multiply(headBindLocalQuat);
    const headFinalWorldQuat = headResidualQuat.clone().multiply(headBaselineWorldQuat);
    bones['Head'].quaternion.copy(headParentWorldQuat.clone().invert().multiply(headFinalWorldQuat));
    bones['Head'].updateWorldMatrix(true, false);
    
    // Copy the final world rotation of the head to the proxy, adjusting for maskGroup's own rotation
    if (headProxy) {
      const maskWorldQuat = new THREE.Quaternion();
      maskGroup.getWorldQuaternion(maskWorldQuat);
      headProxy.quaternion.copy(maskWorldQuat.clone().invert().multiply(headFinalWorldQuat));
      headProxy.updateMatrixWorld(true);
    }
  }

  // Update Face Card texture cropping and visibility
  if (faceCardMesh && faceTexture) {
    faceCardMesh.visible = helmetRemoved;
    if (helmetRemoved && lastFaceLandmarks) {
      let minX = 1, maxX = 0, minY = 1, maxY = 0;
      for (const idx of FACE_OVAL_LOOP) {
        const lm = lastFaceLandmarks[idx];
        if (lm) {
          if (lm.x < minX) minX = lm.x;
          if (lm.x > maxX) maxX = lm.x;
          if (lm.y < minY) minY = lm.y;
          if (lm.y > maxY) maxY = lm.y;
        }
      }
      
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const w = maxX - minX;
      const h = maxY - minY;
      
      const ew = w * FACE_CUTOUT_EXPAND;
      const eh = h * FACE_CUTOUT_EXPAND;
      
      // With flipY = false, both MediaPipe and the Texture share the same coordinate system 
      // (0,0 is top-left). We don't need to invert X because the CSS scaleX(-1) on the canvas 
      // will naturally mirror the unmirrored texture for the user.
      faceTexture.offset.set(cx - ew/2, cy - eh/2);
      faceTexture.repeat.set(ew, eh);
      
      // Keep the aspect ratio proportional. Sized a bit larger than the
      // visor opening on purpose -- the stencil mask (see loadSuit) clips
      // any overflow to the visor's exact silhouette, so this only needs
      // to be generous enough that no gap ever opens at the visor's edges
      // as the head turns.
      const targetHeight = 0.30;
      const targetWidth = targetHeight * (ew / eh) * (video.videoWidth / video.videoHeight);
      
      // Scale X and Z equally to maintain the circular curve of the cylinder!
      faceCardMesh.scale.set(targetWidth, targetHeight, targetWidth);
    }
  }

  updateZeroGAnimation(performance.now() / 1000);
}

async function loop(){
  const now = performance.now();
  if(trackingReady && faceLandmarker && video.readyState >= 2){
    const results = faceLandmarker.detectForVideo(video, now);
    if(results.facialTransformationMatrixes && results.facialTransformationMatrixes.length){
      lastMatrixData = results.facialTransformationMatrixes[0].data;
      lastFaceLandmarks = (results.faceLandmarks && results.faceLandmarks[0]) || lastFaceLandmarks;
    }
  }
  updateEnvironment(now / 1000);

  if(maskGroup && bonesReady){
    updatePlacementAndPose();
    renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
}

function drawTrackingDots(){
  dotsCtx.clearRect(0,0,dotsCanvas.width, dotsCanvas.height);
  if(!showDots) return;

  if(lastFaceLandmarks){
    dotsCtx.save();
    dotsCtx.translate(dotsCanvas.width / 2, dotsCanvas.height / 2);
    dotsCtx.scale(VIRTUAL_ZOOM, VIRTUAL_ZOOM);
    dotsCtx.translate(-dotsCanvas.width / 2, -dotsCanvas.height / 2);
    
    dotsCtx.fillStyle = '#FF9933';
    for(const idx of MARK_POINTS){
      const lm = lastFaceLandmarks[idx];
      if(!lm) continue;
      const x = lm.x * dotsCanvas.width;
      const y = lm.y * dotsCanvas.height;
      dotsCtx.beginPath();
      dotsCtx.arc(x, y, 3, 0, Math.PI*2);
      dotsCtx.fill();
    }
    dotsCtx.restore();
  }
}

// Capture now grabs the rendered glCanvas only -- since the background is
// fully virtual (rendered by Three.js, not the camera), there's no need
// to composite the real video frame underneath anymore.
snapBtn.addEventListener('click', ()=>{
  const shot = document.createElement('canvas');
  shot.width = video.videoWidth || glCanvas.width;
  shot.height = video.videoHeight || glCanvas.height;
  const sctx = shot.getContext('2d');
  // Keep the same mirrored orientation the user sees on screen (glCanvas
  // is displayed with CSS scaleX(-1), but its raw pixel buffer is not
  // mirrored, so flip it the same way here).
  sctx.translate(shot.width, 0);
  sctx.scale(-1, 1);
  sctx.drawImage(glCanvas, 0, 0, shot.width, shot.height);
  // Face cutout sits above the suit render, so composite it in the same
  // mirrored pass -- it's already the same size/orientation as glCanvas.
  sctx.drawImage(faceCanvas, 0, 0, shot.width, shot.height);
  sctx.setTransform(1,0,0,1,0,0);

  // Burn the text overlay into the capture so it shows in the saved image.
  const tw = shot.width;
  const th = shot.height;
  const fontSize1 = Math.max(14, Math.round(tw * 0.028));
  const fontSize2 = Math.max(16, Math.round(tw * 0.034));
  const textY = th - Math.round(th * 0.12);

  sctx.textAlign = 'center';
  sctx.shadowColor = 'rgba(0,0,0,0.85)';
  sctx.shadowBlur = 10;

  // Line 1: anniversary
  sctx.font = `700 ${fontSize1}px Orbitron, sans-serif`;
  sctx.fillStyle = '#FF9933';
  sctx.fillText('HAPPY 57TH ANNIVERSARY OF ISRO 🚀', tw/2, textY);

  // Line 2: vyomnaut name
  sctx.font = `400 ${fontSize2}px Outfit, sans-serif`;
  sctx.fillStyle = '#ffffff';
  sctx.fillText(`I am ${userName}, a future Vyomnaut`, tw/2, textY + fontSize1 + 8);
  sctx.shadowBlur = 0;

  const dataUrl = shot.toDataURL('image/png');
  thumbImg.src = dataUrl;
  thumb.style.display = 'block';
  thumb.onclick = ()=>{
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'gaganyatri-lens-capture.png';
    a.click();
  };
});

recalBtn.addEventListener('click', ()=>{
  smoothedScale = null;
  smoothedStretch = {};
});

flipBtn.addEventListener('click', ()=>{
  flip180 = !flip180;
  flipBtn.classList.toggle('active', flip180);
});

dotsBtn.addEventListener('click', ()=>{
  showDots = !showDots;
  dotsBtn.classList.toggle('active', showDots);
});

envBtn.addEventListener('click', ()=>{
  envEnabled = !envEnabled;
  envBtn.classList.toggle('active', envEnabled);
});

helmetBtn.addEventListener('click', ()=>{
  helmetRemoved = !helmetRemoved;
  // Instead of hiding the visor entirely, make it semi-transparent (tinted
  // glass look) so the face cutout shows through but alignment drift is
  // masked by the tint overlay.
  for(const m of helmetMeshes){
    const mats = Array.isArray(m.material) ? m.material : [m.material];
    for(const mat of mats){
      if(helmetRemoved){
        mat.transparent = true;
        mat.opacity = 0.18;
        mat.depthWrite = false;
      } else {
        mat.transparent = mat._origTransparent || false;
        mat.opacity = mat._origOpacity !== undefined ? mat._origOpacity : 1;
        mat.depthWrite = true;
      }
      mat.needsUpdate = true;
    }
  }
  helmetBtn.classList.toggle('active', helmetRemoved);
  if(!helmetRemoved){
    faceCtx.clearRect(0, 0, faceCanvas.width, faceCanvas.height);
  }
});

function openSheet(){ sheet.classList.add('open'); sheetBackdrop.classList.add('open'); }
function closeSheet(){ sheet.classList.remove('open'); sheetBackdrop.classList.remove('open'); }
settingsBtn.addEventListener('click', openSheet);
sheetBackdrop.addEventListener('click', closeSheet);

window.addEventListener('resize', ()=>{
  if(renderer && video.videoWidth){
    renderer.setSize(video.videoWidth, video.videoHeight, false);
    if(camera){
      camera.aspect = video.videoWidth / video.videoHeight;
      camera.updateProjectionMatrix();
    }
  }
});
</script>
