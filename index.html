<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Gaganyatri Lens</title>
<style>
  :root{
    --saffron:#FF9933;
    --white:#FFFFFF;
    --green:#138808;
    --chakra:#0b1f6b;
    --glass:rgba(10,12,20,0.42);
    --glass-border:rgba(255,255,255,0.16); 
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;}
  .stage{position:fixed;inset:0;background:#000;touch-action:none;}
  /* Camera feed is kept alive for tracking but never shown -- the visible
     background is now the fully virtual scene rendered onto glCanvas. */
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;background:#000;}
  canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);pointer-events:none;}
  canvas.dots{z-index:3;}

  .status-dot{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#777;z-index:12;box-shadow:0 0 8px #777;transition:background .25s,box-shadow .25s;}
  .status-dot.fitting{background:var(--saffron);box-shadow:0 0 8px var(--saffron);animation:blink 0.9s ease-in-out infinite;}
  .status-dot.locked{background:var(--green);box-shadow:0 0 8px var(--green);}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

  .top-bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;z-index:11;}
  .brand{width:32px;height:32px;animation:spin 9s linear infinite;filter:drop-shadow(0 1px 3px rgba(0,0,0,0.6));}
  @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  .top-actions{display:flex;gap:10px;}

  .icon-btn{width:40px;height:40px;border-radius:50%;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;}
  .icon-btn svg{width:19px;height:19px;}
  .icon-btn.active{border-color:var(--saffron);color:var(--saffron);}
  .icon-btn:active{transform:scale(0.92);}

  .bottom-bar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:11;}
  .side-slot{width:50px;height:50px;display:flex;align-items:center;justify-content:center;}
  .thumb{width:100%;height:100%;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,0.7);background:#111;display:none;cursor:pointer;}
  .thumb img{width:100%;height:100%;object-fit:cover;}

  .shutter{width:74px;height:74px;border-radius:50%;padding:4px;cursor:pointer;background:conic-gradient(var(--saffron) 0 33%, var(--white) 33% 66%, var(--green) 66% 100%);}
  .shutter:active{transform:scale(0.94);}
  .shutter-inner{width:100%;height:100%;border-radius:50%;background:#fff;}

  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:15;opacity:0;pointer-events:none;transition:opacity .2s;}
  .sheet-backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#12141fee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px 20px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:16;border-top:2px solid var(--saffron);}
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;border-radius:3px;background:#444;margin:6px auto 14px;}
  .sheet-row{display:flex;align-items:center;gap:14px;padding:10px 0;}
  .sheet-row svg{width:20px;height:20px;flex:0 0 20px;color:#c7cae6;}
  .sheet-row input[type=range]{flex:1;accent-color:var(--saffron);}
  .toggle-row{display:flex;gap:10px;padding:8px 0 4px;}
  .toggle-row .icon-btn{background:#1c1f30;}

  .start-overlay{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:20;}
  .start-overlay.hidden{display:none;}
  .start-ring{width:84px;height:84px;border-radius:50%;padding:5px;background:conic-gradient(var(--saffron),var(--white) 33%,var(--white) 66%,var(--green));cursor:pointer;}
  .start-ring-inner{width:100%;height:100%;border-radius:50%;background:#0a0c14;display:flex;align-items:center;justify-content:center;color:#fff;}
  .start-ring-inner svg{width:32px;height:32px;}
  .start-ring.spinning .start-ring-inner svg{animation:spin 1s linear infinite;}
  .start-ring.err{background:conic-gradient(#ff6b4d,#ff6b4d);}
  .err-msg{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);left:20px;right:20px;text-align:center;color:#ff6b4d;font:13px/1.4 -apple-system,sans-serif;display:none;}
  .err-msg.show{display:block;}
</style>
</head>

<script type="module">
import { FaceLandmarker, PoseLandmarker, HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

const SUIT_URL = './Advanced_Crew_Escape_Suit.glb';
const SCALE_BOOST = 1.0;
const METERS_TO_SCENE_UNITS = 100;
const DEFAULT_FLIP = true;

const POSE_X_SIGN = 1;
const POSE_Y_SIGN = -1;
const POSE_Z_SIGN = -1;

const HAND_X_SIGN = 1;
const HAND_Y_SIGN = -1;
const HAND_Z_SIGN = -1;

const video = document.getElementById('video');
const glCanvas = document.getElementById('glCanvas');
const dotsCanvas = document.getElementById('dotsCanvas');
const dotsCtx = dotsCanvas.getContext('2d');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const errMsg = document.getElementById('errMsg');
const statusDot = document.getElementById('statusDot');
const snapBtn = document.getElementById('snapBtn');
const thumb = document.getElementById('thumb');
const thumbImg = document.getElementById('thumbImg');
const flipBtn = document.getElementById('flipBtn');
const dotsBtn = document.getElementById('dotsBtn');
const settingsBtn = document.getElementById('settingsBtn');
const recalBtn = document.getElementById('recalBtn');
const sheet = document.getElementById('sheet');
const sheetBackdrop = document.getElementById('sheetBackdrop');
const poseRetargetBtn = document.getElementById('poseRetargetBtn');
const envBtn = document.getElementById('envBtn');
const rFine = document.getElementById('rFine');
const rDepth = document.getElementById('rDepth');
const rHeight = document.getElementById('rHeight');
const rTilt = document.getElementById('rTilt');

let showDots = true;
let poseRetargetEnabled = true;
let flip180 = DEFAULT_FLIP;
let envEnabled = true;

let faceLandmarker = null;
let trackingReady = false;
let usingFallback = false;
let lastMatrixData = null;
let lastFaceLandmarks = null;
let renderer, scene, camera, maskGroup;
let envGroup = null;
let envPanels = [];
// Smoothed environment parallax rotation, driven by head yaw/pitch --
// see updatePlacementAndPose(). Kept separate from envGroup.rotation
// itself so we can lerp toward a target each frame instead of snapping.
let smoothedEnvYaw = 0;
let smoothedEnvPitch = 0;
const PARALLAX_YAW = 0.32;   // how much env rotation per radian of head yaw
const PARALLAX_PITCH = 0.22; // how much env rotation per radian of head pitch
const PARALLAX_SMOOTH = 0.08; // lerp factor per frame -- lower = dreamier/slower
let bones = null;
let bonesReady = false;
let restShoulderWidth = null;
let smoothedScale = null;

const BONE_CHAIN_NEXT = { 'LeftArm':'LeftForeArm', 'RightArm':'RightForeArm' };
const STRETCH_BONES = new Set(Object.keys(BONE_CHAIN_NEXT));
let boneRestLength = {};
let smoothedStretch = {};
let shoulderBindLocalQuat = {}; // true bind-pose LOCAL rotation, cached once at load
let armRestWorldDir = {}; // true bind-pose WORLD direction of shoulder->elbow per arm
let boneTwist = {}; // { boneName: twist quaternion }, cached once at load
let headBindLocalQuat = null; // bind-pose LOCAL rotation of the Head bone, cached once at load

const MIN_LIVE_SHOULDER_M = 0.15;
const MAX_LIVE_SHOULDER_M = 0.65;
let manualOffset = {x:0, y:0};
let suitLoadFailed = false;
const CHEEK_L = 234, CHEEK_R = 454;
const MARK_POINTS = [234, 454, 1, 152, 10, 33, 263];

let poseLandmarker = null;
let poseTrackingReady = false;
let lastPoseLandmarks = null;
let lastPoseWorldLandmarks = null;
const SHOULDER_L = 11, SHOULDER_R = 12;
const ELBOW_L = 13, ELBOW_R = 14;
const WRIST_L = 15, WRIST_R = 16;
const PINKY_L = 17, PINKY_R = 18;
const INDEX_L = 19, INDEX_R = 20;
const HIP_L = 23, HIP_R = 24;
const KNEE_L = 25, KNEE_R = 26;
const ANKLE_L = 27, ANKLE_R = 28;
const FOOT_INDEX_L = 31, FOOT_INDEX_R = 32;
const POSE_MARK_POINTS = [SHOULDER_L, SHOULDER_R, HIP_L, HIP_R, ELBOW_L, ELBOW_R, WRIST_L, WRIST_R, INDEX_L, INDEX_R, KNEE_L, KNEE_R, ANKLE_L, ANKLE_R, FOOT_INDEX_L, FOOT_INDEX_R];
const POSE_VISIBILITY_MIN = 0.5;

// SHOULDER_FOLLOW_FACTOR: how much of the arm's swing the clavicle
// (LeftShoulder/RightShoulder) absorbs each frame. The rig's suit-fabric
// mesh is heavily skin-weighted across BOTH the Shoulder and Arm bones
// (confirmed by inspecting the GLB: ~650 verts on LeftShoulder, ~670 on
// LeftArm). Previously only Arm/ForeArm/Hand/UpLeg/Leg/Foot were driven,
// so Shoulder stayed frozen in bind pose while Arm swung freely -- at
// full extension that's a huge transform gap between two bones sharing
// the same blended vertices, which tears the mesh into the spiky
// "candy wrapper" shapes seen at the deltoid/collar seam. Partially
// rotating the shoulder toward the same direction closes that gap.
// 0 = old frozen behavior. 1 = shoulder fully tracks (looks robotic).
// Tuned numerically against seam-test.mjs (not by eye): 0.5 is the value
// that minimizes the WORSE of the two seam mismatches (chest seam vs
// elbow-side seam) across the whole 0-90 degree "normal pose" range --
// verified to keep both seams under the 40-degree tear-risk threshold for
// arms at sides through full shoulder-height raise. See seam-test.mjs for
// the full sweep and how this number was derived.
const SHOULDER_FOLLOW_FACTOR = 0.5;
// Hard ceiling on how far the clavicle itself is allowed to swing, in
// degrees, no matter how extreme the tracked arm direction is. Only
// engages well past shoulder height (>~112 degrees at this factor), so it
// has no effect on the normal-pose range this is tuned for -- it just
// keeps the overhead case from swinging the chest seam open completely.
const MAX_SHOULDER_SWING_DEG = 40;
const MAX_SHOULDER_SWING_RAD = THREE.MathUtils.degToRad(MAX_SHOULDER_SWING_DEG);

const BONE_CHAINS = [
  ['LeftArm', SHOULDER_L, ELBOW_L],
  ['LeftForeArm', ELBOW_L, WRIST_L],
  ['LeftHand', WRIST_L, INDEX_L],
  ['RightArm', SHOULDER_R, ELBOW_R],
  ['RightForeArm', ELBOW_R, WRIST_R],
  ['RightHand', WRIST_R, INDEX_R],
  ['LeftUpLeg', HIP_L, KNEE_L],
  ['LeftLeg', KNEE_L, ANKLE_L],
  ['RightUpLeg', HIP_R, KNEE_R],
  ['RightLeg', KNEE_R, ANKLE_R],
  ['LeftFoot', ANKLE_L, FOOT_INDEX_L],
  ['RightFoot', ANKLE_R, FOOT_INDEX_R],
];

const INDEX_MCP = 5, INDEX_PIP = 6, INDEX_DIP = 7, INDEX_TIP = 8;
const FINGER_CHAINS = [
  ['LeftHandIndex1', INDEX_MCP, INDEX_PIP, 'Left'],
  ['LeftHandIndex2', INDEX_PIP, INDEX_DIP, 'Left'],
  ['LeftHandIndex3', INDEX_DIP, INDEX_TIP, 'Left'],
  ['RightHandIndex1', INDEX_MCP, INDEX_PIP, 'Right'],
  ['RightHandIndex2', INDEX_PIP, INDEX_DIP, 'Right'],
  ['RightHandIndex3', INDEX_DIP, INDEX_TIP, 'Right'],
];

let handLandmarker = null;
let handTrackingReady = false;
let lastHandLandmarks = [];
let lastHandWorldByLabel = {};
const HAND_CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];
let dragging = false, dragStart = {x:0,y:0};
let cameraStarted = false;

function setViewfinderAspect(w, h){
  dotsCanvas.width = w;
  dotsCanvas.height = h;
}

startBtn.addEventListener('click', ()=>{
  if(cameraStarted) return;
  cameraStarted = true;
  startBtn.classList.add('spinning');
  startCamera();
});

async function startCamera(){
  try{
    const targetAR = window.innerWidth / window.innerHeight;
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', aspectRatio: { ideal: targetAR }, width:{ideal:1280}, height:{ideal:1280/targetAR} },
      audio:false
    });
    video.srcObject = stream;
    await new Promise(res=> video.onloadedmetadata = res);
    await video.play();
    setViewfinderAspect(video.videoWidth, video.videoHeight);
    initThree();
    await Promise.all([loadTracking(), loadSuit()]);

    if(suitLoadFailed){
      startBtn.classList.remove('spinning');
      startBtn.classList.add('err');
      errMsg.textContent = 'Suit model failed to load, or the expected skeleton bones were missing — check SUIT_URL / that this is the rigged export.';
      errMsg.classList.add('show');
      cameraStarted = false;
      return;
    }

    statusEl.classList.add('hidden');
    requestAnimationFrame(loop);
  }catch(err){
    console.error(err);
    startBtn.classList.remove('spinning');
    startBtn.classList.add('err');
    errMsg.textContent = 'Camera permission denied or unavailable.';
    errMsg.classList.add('show');
    cameraStarted = false;
  }
}

function initThree(){
  renderer = new THREE.WebGLRenderer({ canvas: glCanvas, alpha:true, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.75));
  renderer.setSize(video.videoWidth, video.videoHeight, false);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(63, video.videoWidth/video.videoHeight, 1, 6000);
  camera.position.set(0,0,0);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x2a2a2a, 1.2));
  const dir = new THREE.DirectionalLight(0xffffff, 1.5);
  dir.position.set(0, 80, 150);
  scene.add(dir);
  const fill = new THREE.DirectionalLight(0xfff2d9, 0.6);
  fill.position.set(-100, 40, -80);
  scene.add(fill);

  maskGroup = new THREE.Group();
  maskGroup.matrixAutoUpdate = false;
  scene.add(maskGroup);

  buildSpaceEnvironment();
}

// Builds a fully virtual "inside a spacecraft, looking out at Earth"
// backdrop directly in the Three.js scene, so nothing from the real
// camera feed is ever shown -- only used headlessly for tracking. Kept
// as plain geometry/materials (no external textures) so it loads
// instantly and has no licensing/asset dependencies.
function buildSpaceEnvironment(){
  envGroup = new THREE.Group();
  envPanels = [];

  scene.background = new THREE.Color(0x02030a);
  scene.fog = new THREE.FogExp2(0x02030a, 0.00035);

  // Starfield -- scattered points on a large shell around the scene.
  const starCount = 2200;
  const starPos = new Float32Array(starCount * 3);
  for(let i=0;i<starCount;i++){
    const r = 1600 + Math.random()*1800;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos((Math.random()*2)-1);
    starPos[i*3]   = r*Math.sin(phi)*Math.cos(theta);
    starPos[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
    starPos[i*3+2] = r*Math.cos(phi) - 600;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color:0xffffff, size:2.4, sizeAttenuation:true, transparent:true, opacity:0.9 });
  envGroup.add(new THREE.Points(starGeo, starMat));

  // Earth, seen through the "window" ahead and to one side.
  const earthMat = new THREE.MeshStandardMaterial({ color:0x1c5fae, emissive:0x0a2a4d, emissiveIntensity:0.65, roughness:0.75, metalness:0.1 });
  const earth = new THREE.Mesh(new THREE.SphereGeometry(280, 48, 48), earthMat);
  earth.position.set(480, -160, -2000);
  envGroup.add(earth);
  const cloudMat = new THREE.MeshStandardMaterial({ color:0xffffff, transparent:true, opacity:0.14, roughness:1 });
  const clouds = new THREE.Mesh(new THREE.SphereGeometry(286, 32, 32), cloudMat);
  clouds.position.copy(earth.position);
  envGroup.add(clouds);
  const earthGlow = new THREE.PointLight(0x4d8fdd, 0.8, 3000);
  earthGlow.position.copy(earth.position);
  envGroup.add(earthGlow);

  // Spacecraft hull -- an open cylinder surrounding the camera, seen
  // from the inside (BackSide material), so it reads as a module wall
  // rather than a solid object blocking the view.
  const hullMat = new THREE.MeshStandardMaterial({ color:0x6b7686, metalness:0.55, roughness:0.5, side:THREE.BackSide });
  const hull = new THREE.Mesh(new THREE.CylinderGeometry(1000, 1000, 3000, 40, 1, true), hullMat);
  hull.rotation.z = Math.PI/2;
  hull.position.set(0, 0, -400);
  envGroup.add(hull);

  // Accent ribs along the hull, alternating saffron/green -- a nod to
  // the tricolour without being literal, and they double as depth cues.
  for(let i=-4;i<=4;i++){
    const isSaffron = i % 2 === 0;
    const ringMat = new THREE.MeshBasicMaterial({
      color: isSaffron ? 0xff9933 : 0x138808,
      transparent: true, opacity: 0.45
    });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(996, 3.5, 8, 48), ringMat);
    ring.rotation.x = Math.PI/2;
    ring.position.z = -400 + i*420;
    envGroup.add(ring);
    envPanels.push({ mesh: ring, baseOpacity: 0.45, phase: i*0.7 });
  }

  // A couple of low console-style light strips near the bottom edge of
  // frame, for a cockpit feel. Purely decorative emissive boxes.
  const consoleColors = [0xff9933, 0xffffff, 0x138808];
  for(let i=0;i<consoleColors.length;i++){
    const mat = new THREE.MeshBasicMaterial({ color: consoleColors[i], transparent:true, opacity:0.55 });
    const strip = new THREE.Mesh(new THREE.BoxGeometry(60, 4, 4), mat);
    strip.position.set(-90 + i*90, -230, -260);
    envGroup.add(strip);
    envPanels.push({ mesh: strip, baseOpacity: 0.55, phase: i*1.3 });
  }

  scene.add(envGroup);
}

function updateEnvironment(timeSec){
  if(!envGroup) return;
  envGroup.visible = envEnabled;
  if(!envEnabled) return;
  // Gentle blink/pulse on the accent panels so it doesn't feel static.
  for(const p of envPanels){
    const pulse = 0.75 + 0.25*Math.sin(timeSec*1.4 + p.phase);
    p.mesh.material.opacity = p.baseOpacity * pulse;
  }
}

async function loadTracking(){
  let filesetResolver;
  try{
    filesetResolver = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU"
      },
      outputFaceBlendshapes: false,
      outputFacialTransformationMatrixes: true,
      runningMode: "VIDEO",
      numFaces: 1
    });
    trackingReady = true;
  }catch(e){
    usingFallback = true;
    enableDragFallback();
    return;
  }

  try{
    poseLandmarker = await PoseLandmarker.createFromOptions(filesetResolver, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numPoses: 1
    });
    poseTrackingReady = true;
  }catch(e){
    console.warn('pose tracking unavailable, suit will stay in bind pose', e);
    poseTrackingReady = false;
  }

  try{
    handLandmarker = await HandLandmarker.createFromOptions(filesetResolver, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numHands: 2
    });
    handTrackingReady = true;
  }catch(e){
    console.warn('hand tracking unavailable', e);
    handTrackingReady = false;
  }
}

function loadSuit(){
  return new Promise((resolve)=>{
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
    dracoLoader.setDecoderConfig({ type: 'wasm' });

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);
    loader.setCrossOrigin('anonymous');
    loader.load(SUIT_URL, (gltf)=>{
      const root = gltf.scene;
      root.traverse(o=>{
        if(o.isMesh){
          o.frustumCulled = false;
          // The suit's interior lining ("ACES_INTERIOR...") is authored
          // double-sided in the source file -- normal for an interior
          // surface, since it's only meant to be seen if you look inside a
          // sleeve/collar. But any residual sub-pixel gap at a skin-blend
          // seam (see poseShoulder()) lets the camera see straight through
          // to it, and because it renders both faces that reads as a
          // glaring flash of navy instead of just... not being there.
          // Forcing FrontSide here doesn't touch the source file or the
          // skinning at all -- it just stops that one interior surface
          // from drawing its backfaces, so a stray gap shows background
          // through it instead of bright blue.
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          for(const mat of mats){
            if(mat && mat.name && mat.name.toLowerCase().includes('interior')){
              mat.side = THREE.FrontSide;
            }
          }
        }
      });

      bones = {};
      root.traverse(o=>{
        if(o.isBone){
          const shortName = o.name.replace(/^mixamorig:?/, '');
          bones[shortName] = o;
        }
      });

      if(!bones['Head'] || !bones['Hips'] || !bones['LeftArm'] || !bones['RightArm']){
        console.error('Expected mixamorig bones not found on this GLB — is SUIT_URL pointing at the rigged export?');
        suitLoadFailed = true;
        dracoLoader.dispose();
        resolve();
        return;
      }

      root.updateMatrixWorld(true);
      const headPos = new THREE.Vector3();
      bones['Head'].getWorldPosition(headPos);
      root.position.sub(headPos);
      root.updateMatrixWorld(true);

      const lp = new THREE.Vector3(), rp = new THREE.Vector3();
      bones['LeftArm'].getWorldPosition(lp);
      bones['RightArm'].getWorldPosition(rp);
      restShoulderWidth = lp.distanceTo(rp) || 0.3;

      boneRestLength = {};
      for(const [name, childName] of Object.entries(BONE_CHAIN_NEXT)){
        const b = bones[name], cb = bones[childName];
        if(!b || !cb) continue;
        const bp = new THREE.Vector3(), cp = new THREE.Vector3();
        b.getWorldPosition(bp);
        cb.getWorldPosition(cp);
        boneRestLength[name] = bp.distanceTo(cp) || 0.01;
      }

      // Cache bind-pose TWIST for every bone pointBoneTo() will ever pose
      // (all BONE_CHAINS + FINGER_CHAINS entries) -- see computeSwingTwist().
      boneTwist = {};
      const posedBoneNames = new Set([
        ...BONE_CHAINS.map(c=>c[0]),
        ...FINGER_CHAINS.map(c=>c[0]),
      ]);
      for(const name of posedBoneNames){
        const b = bones[name];
        if(b) boneTwist[name] = computeSwingTwist(b.quaternion.clone());
      }

      // Cache the TRUE bind-pose LOCAL rotation for the shoulder bones,
      // right now before poseShoulder() ever touches them. poseShoulder()
      // used to read the bone's current quaternion each frame and treat it
      // as "rest" -- but after frame 1 that's already last frame's rotated
      // result, not bind pose, so "rest" silently drifted every frame
      // instead of staying fixed. This is what caused tearing even with
      // arms relaxed, not just at extreme reach.
      shoulderBindLocalQuat = {};
      for(const name of ['LeftShoulder','RightShoulder']){
        const b = bones[name];
        if(b) shoulderBindLocalQuat[name] = b.quaternion.clone();
      }

      // Cache the Head bone's bind-pose LOCAL rotation too. Needed by the
      // root-rotation split in updatePlacementAndPose(): the face-tracked
      // pitch/roll (nodding, tilting) is applied ONLY to this bone, on top
      // of its own bind pose, instead of to the whole root/body.
      if(bones['Head']){
        headBindLocalQuat = bones['Head'].quaternion.clone();
      }

      // True bind-pose world direction of shoulder->elbow for each arm,
      // needed by poseShoulder() to measure the ARM's real swing angle
      // (as opposed to comparing against the shoulder's own unrelated
      // clavicle axis, which was the earlier bug).
      armRestWorldDir = {};
      for(const name of ['LeftArm','RightArm']){
        const b = bones[name];
        if(!b) continue;
        const q = new THREE.Quaternion();
        b.getWorldQuaternion(q);
        armRestWorldDir[name] = new THREE.Vector3(0,1,0).applyQuaternion(q).normalize();
      }

      maskGroup.add(root);
      bonesReady = true;
      dracoLoader.dispose();
      resolve();
    }, undefined, (err)=>{
      console.error('suit load failed', err);
      suitLoadFailed = true;
      dracoLoader.dispose();
      resolve();
    });
  });
}

function enableDragFallback(){
  glCanvas.style.pointerEvents = 'auto';
  const start = (x,y)=>{ dragging = true; dragStart = {x,y, ox:manualOffset.x, oy:manualOffset.y}; };
  const move = (x,y)=>{
    if(!dragging) return;
    manualOffset.x = dragStart.ox + (x - dragStart.x) * 0.4;
    manualOffset.y = dragStart.oy - (y - dragStart.y) * 0.4;
  };
  glCanvas.addEventListener('pointerdown', e=> start(e.clientX, e.clientY));
  window.addEventListener('pointermove', e=> move(e.clientX, e.clientY));
  window.addEventListener('pointerup', ()=> dragging = false);
}

function mpVec(lm){
  return new THREE.Vector3(lm.x*POSE_X_SIGN, lm.y*POSE_Y_SIGN, lm.z*POSE_Z_SIGN);
}

function mpVecHand(lm){
  return new THREE.Vector3(lm.x*HAND_X_SIGN, lm.y*HAND_Y_SIGN, lm.z*HAND_Z_SIGN);
}

const _tmpQ = new THREE.Quaternion();
const RESTY = new THREE.Vector3(0,1,0);

function pointBoneTo(bone, targetWorldDir, twistQuat){
  bone.parent.updateWorldMatrix(true, false);
  bone.parent.getWorldQuaternion(_tmpQ);
  _tmpQ.invert();
  const localDir = targetWorldDir.clone().applyQuaternion(_tmpQ);
  if(localDir.lengthSq() < 1e-8) return;
  localDir.normalize();
  const swing = new THREE.Quaternion().setFromUnitVectors(RESTY, localDir);
  // Recompose with this bone's ORIGINAL bind-pose twist instead of
  // discarding it. setFromUnitVectors alone always returns the
  // shortest-arc rotation with zero twist around the target axis --
  // proven with a standalone numeric test (seam-test.mjs) to silently
  // erase ~40 degrees of this rig's baked-in bind-pose roll on the arm
  // alone, EVEN AT REST, before any live tracking motion at all. That was
  // a bigger, rig-wide source of distortion (every BONE_CHAINS bone, not
  // just the shoulder) than any of the shoulder-specific tuning.
  bone.quaternion.copy(twistQuat ? swing.clone().multiply(twistQuat) : swing);
  bone.updateWorldMatrix(true, false);
}

// Decomposes a bone's true bind-pose LOCAL quaternion into swing (aim
// toward its child) + twist (roll around that aim axis). Only the twist
// part needs to be cached and reapplied every frame -- see pointBoneTo().
function computeSwingTwist(bindLocalQuat){
  const bindDir = new THREE.Vector3(0,1,0).applyQuaternion(bindLocalQuat).normalize();
  const swing = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), bindDir);
  return swing.clone().invert().multiply(bindLocalQuat);
}

// Partially rotates a clavicle bone (LeftShoulder/RightShoulder) toward the
// same shoulder->elbow direction driving the arm below it, blended with its
// own bind-pose direction by SHOULDER_FOLLOW_FACTOR. Must run BEFORE the
// BONE_CHAINS loop poses 'LeftArm'/'RightArm': pointBoneTo() recomputes each
// bone's local rotation from its parent's CURRENT world matrix, so once the
// shoulder is partially rotated here, the arm's own pointBoneTo call
// automatically needs a smaller local rotation to reach the same live
// elbow direction -- the two bones share the swing instead of the shoulder
// staying frozen while the arm does all of it (which is what was tearing
// the skin-weight blend at the deltoid/collar seam).
function poseShoulder(boneName, shoulderIdx, elbowIdx, worldLandmarks, armRestWorldDir){
  const bone = bones[boneName];
  if(!bone || !armRestWorldDir) return;
  const p = worldLandmarks[shoulderIdx], c = worldLandmarks[elbowIdx];
  if(!p || !c) return;
  if((p.visibility !== undefined && p.visibility < POSE_VISIBILITY_MIN) ||
     (c.visibility !== undefined && c.visibility < POSE_VISIBILITY_MIN)) return;
  const liveDir = mpVec(c).sub(mpVec(p));
  if(liveDir.lengthSq() < 1e-8) return;
  liveDir.normalize();

  const bindLocal = shoulderBindLocalQuat[boneName];
  if(!bindLocal) return;

  const swingQuat = new THREE.Quaternion().setFromUnitVectors(armRestWorldDir, liveDir);
  const swingAngle = 2 * Math.acos(THREE.MathUtils.clamp(Math.abs(swingQuat.w), -1, 1));
  if(swingAngle < 1e-4) return;

  const desiredAngle = Math.min(swingAngle * SHOULDER_FOLLOW_FACTOR, MAX_SHOULDER_SWING_RAD);
  const t = desiredAngle / swingAngle;
  const identity = new THREE.Quaternion();
  const partialSwing = identity.clone().slerp(swingQuat, t);

  bone.parent.updateWorldMatrix(true, false);
  const parentWorldQuat = new THREE.Quaternion();
  bone.parent.getWorldQuaternion(parentWorldQuat);
  const bindWorldQuat = parentWorldQuat.clone().multiply(bindLocal);
  const newWorldQuat = partialSwing.clone().multiply(bindWorldQuat);
  const invParent = parentWorldQuat.clone().invert();
  bone.quaternion.copy(invParent.multiply(newWorldQuat));
  bone.updateWorldMatrix(true, false);
}

function armStraightness(worldLandmarks, shoulderIdx, elbowIdx, wristIdx){
  const s = worldLandmarks[shoulderIdx], e = worldLandmarks[elbowIdx], w = worldLandmarks[wristIdx];
  if(!s || !e || !w) return 1;
  const upper = mpVec(e).sub(mpVec(s));
  const lower = mpVec(w).sub(mpVec(e));
  if(upper.lengthSq() < 1e-8 || lower.lengthSq() < 1e-8) return 1;
  upper.normalize(); lower.normalize();
  return THREE.MathUtils.clamp(upper.dot(lower), 0, 1);
}

function applyBoneStretch(bone, boneName, liveLen, bendFactor){
  const restLen = boneRestLength[boneName];
  if(!restLen) return;
  const globalScale = smoothedScale || 1;
  const rawTarget = THREE.MathUtils.clamp((liveLen / restLen) / globalScale, 0.85, 1.35);
  const targetStretch = 1 + (rawTarget - 1) * bendFactor;
  const prev = smoothedStretch[boneName];
  const next = (prev === undefined) ? targetStretch : prev + (targetStretch - prev) * 0.12;
  smoothedStretch[boneName] = next;
  bone.scale.set(1, next, 1);
}

function applyPoseToSkeleton(worldLandmarks){
  // Clavicles first -- see poseShoulder() comment for why order matters.
  poseShoulder('LeftShoulder', SHOULDER_L, ELBOW_L, worldLandmarks, armRestWorldDir['LeftArm']);
  poseShoulder('RightShoulder', SHOULDER_R, ELBOW_R, worldLandmarks, armRestWorldDir['RightArm']);

  const leftBend = armStraightness(worldLandmarks, SHOULDER_L, ELBOW_L, WRIST_L);
  const rightBend = armStraightness(worldLandmarks, SHOULDER_R, ELBOW_R, WRIST_R);
  for(const [boneName, pIdx, cIdx] of BONE_CHAINS){
    const bone = bones[boneName];
    if(!bone) continue;
    const p = worldLandmarks[pIdx], c = worldLandmarks[cIdx];
    if(!p || !c) continue;
    if((p.visibility !== undefined && p.visibility < POSE_VISIBILITY_MIN) ||
       (c.visibility !== undefined && c.visibility < POSE_VISIBILITY_MIN)) continue;
    const dir = mpVec(c).sub(mpVec(p));
    const liveLen = dir.length();
    if(liveLen < 1e-4) continue;
    pointBoneTo(bone, dir.clone().normalize(), boneTwist[boneName]);
    if(STRETCH_BONES.has(boneName)){
      const bendFactor = boneName === 'LeftArm' ? leftBend : rightBend;
      applyBoneStretch(bone, boneName, liveLen, bendFactor);
    }
  }
}

function applyFingersToSkeleton(handWorldByLabel){
  for(const [boneName, pIdx, cIdx, label] of FINGER_CHAINS){
    const bone = bones[boneName];
    const hand = handWorldByLabel[label];
    if(!bone || !hand) continue;
    const p = hand[pIdx], c = hand[cIdx];
    if(!p || !c) continue;
    const dir = mpVecHand(c).sub(mpVecHand(p));
    if(dir.lengthSq() < 1e-8) continue;
    pointBoneTo(bone, dir.normalize(), boneTwist[boneName]);
  }
}

function updatePlacementAndPose(){
  const fine = parseFloat(rFine.value);
  const depth = parseFloat(rDepth.value);
  const height = parseFloat(rHeight.value);
  const tilt = THREE.MathUtils.degToRad(parseFloat(rTilt.value));

  const base = new THREE.Matrix4();
  let headResidualQuat = null;

  if(trackingReady && lastMatrixData){
    const faceMat = new THREE.Matrix4().fromArray(lastMatrixData);
    const facePos = new THREE.Vector3();
    const faceQuat = new THREE.Quaternion();
    const faceScale = new THREE.Vector3();
    faceMat.decompose(facePos, faceQuat, faceScale);

    const faceEuler = new THREE.Euler().setFromQuaternion(faceQuat, 'YXZ');
    const yawOnlyQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, faceEuler.y, 0, 'YXZ'));
    headResidualQuat = yawOnlyQuat.clone().invert().multiply(faceQuat);

    base.compose(facePos, yawOnlyQuat, new THREE.Vector3(1,1,1));

    // Parallax: nudge the environment opposite the head's yaw/pitch, like
    // looking around inside a cabin rather than a flat backdrop tracking
    // the suit. Negative sign is intentional -- turning your head right
    // should reveal more of what's to your left, not follow you.
    if(envGroup){
      const targetYaw = -faceEuler.y * PARALLAX_YAW;
      const targetPitch = -faceEuler.x * PARALLAX_PITCH;
      smoothedEnvYaw += (targetYaw - smoothedEnvYaw) * PARALLAX_SMOOTH;
      smoothedEnvPitch += (targetPitch - smoothedEnvPitch) * PARALLAX_SMOOTH;
      envGroup.rotation.set(smoothedEnvPitch, smoothedEnvYaw, 0);
    }
  } else {
    base.compose(
      new THREE.Vector3(manualOffset.x, manualOffset.y, -300),
      new THREE.Quaternion(),
      new THREE.Vector3(1,1,1)
    );
  }

  let haveLiveScale = false;
  if(lastPoseWorldLandmarks && restShoulderWidth){
    const l = lastPoseWorldLandmarks[SHOULDER_L], r = lastPoseWorldLandmarks[SHOULDER_R];
    if(l && r && (l.visibility===undefined || l.visibility>=POSE_VISIBILITY_MIN) && (r.visibility===undefined || r.visibility>=POSE_VISIBILITY_MIN)){
      const liveShoulderWidth = mpVec(l).distanceTo(mpVec(r));
      if(liveShoulderWidth >= MIN_LIVE_SHOULDER_M && liveShoulderWidth <= MAX_LIVE_SHOULDER_M){
        const targetScale = (liveShoulderWidth / restShoulderWidth) * SCALE_BOOST;
        smoothedScale = (smoothedScale === null) ? targetScale : smoothedScale + (targetScale - smoothedScale) * 0.15;
        haveLiveScale = true;
      }
    }
  }
  statusDot.className = haveLiveScale ? 'status-dot locked' : 'status-dot fitting';

  const finalScale = (smoothedScale !== null ? smoothedScale : SCALE_BOOST) * fine * METERS_TO_SCENE_UNITS;
  const flipYaw = flip180 ? Math.PI : 0;
  const calib = new THREE.Matrix4();
  calib.compose(
    new THREE.Vector3(0, height, depth),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(tilt, flipYaw, 0)),
    new THREE.Vector3(finalScale, finalScale, finalScale)
  );

  maskGroup.matrix.copy(base).multiply(calib);
  maskGroup.matrixWorldNeedsUpdate = true;
  maskGroup.updateMatrixWorld(true);

  if(bonesReady && bones['Head'] && headBindLocalQuat && headResidualQuat){
    bones['Head'].quaternion.copy(headResidualQuat.clone().multiply(headBindLocalQuat));
    bones['Head'].updateWorldMatrix(true, false);
  }

  if(poseRetargetEnabled && lastPoseWorldLandmarks && bonesReady){
    applyPoseToSkeleton(lastPoseWorldLandmarks);
  }
  if(poseRetargetEnabled && bonesReady){
    applyFingersToSkeleton(lastHandWorldByLabel);
  }
}

async function loop(){
  const now = performance.now();
  if(trackingReady && faceLandmarker && video.readyState >= 2){
    const results = faceLandmarker.detectForVideo(video, now);
    if(results.facialTransformationMatrixes && results.facialTransformationMatrixes.length){
      lastMatrixData = results.facialTransformationMatrixes[0].data;
      lastFaceLandmarks = (results.faceLandmarks && results.faceLandmarks[0]) || lastFaceLandmarks;
    }
  }
  if(poseTrackingReady && poseLandmarker && video.readyState >= 2){
    const poseResults = poseLandmarker.detectForVideo(video, now);
    if(poseResults.landmarks && poseResults.landmarks.length){
      lastPoseLandmarks = poseResults.landmarks[0];
    }
    if(poseResults.worldLandmarks && poseResults.worldLandmarks.length){
      lastPoseWorldLandmarks = poseResults.worldLandmarks[0];
    }
  }
  if(handTrackingReady && handLandmarker && video.readyState >= 2){
    const handResults = handLandmarker.detectForVideo(video, now);
    if(handResults.landmarks){
      lastHandLandmarks = handResults.landmarks;
    }
    if(handResults.worldLandmarks && handResults.handednesses){
      const byLabel = {};
      for(let i=0;i<handResults.worldLandmarks.length;i++){
        const cat = handResults.handednesses[i] && handResults.handednesses[i][0];
        if(cat && cat.categoryName) byLabel[cat.categoryName] = handResults.worldLandmarks[i];
      }
      lastHandWorldByLabel = byLabel;
    }
  }

  drawTrackingDots();
  updateEnvironment(now / 1000);

  if(maskGroup && bonesReady){
    updatePlacementAndPose();
    renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
}

function drawTrackingDots(){
  dotsCtx.clearRect(0,0,dotsCanvas.width, dotsCanvas.height);
  if(!showDots) return;

  if(lastFaceLandmarks){
    dotsCtx.fillStyle = '#FF9933';
    for(const idx of MARK_POINTS){
      const lm = lastFaceLandmarks[idx];
      if(!lm) continue;
      const x = lm.x * dotsCanvas.width;
      const y = lm.y * dotsCanvas.height;
      dotsCtx.beginPath();
      dotsCtx.arc(x, y, 3, 0, Math.PI*2);
      dotsCtx.fill();
    }
  }

  if(lastPoseLandmarks){
    dotsCtx.fillStyle = '#138808';
    for(const idx of POSE_MARK_POINTS){
      const lm = lastPoseLandmarks[idx];
      if(!lm) continue;
      if(lm.visibility !== undefined && lm.visibility < POSE_VISIBILITY_MIN) continue;
      const x = lm.x * dotsCanvas.width;
      const y = lm.y * dotsCanvas.height;
      dotsCtx.beginPath();
      dotsCtx.arc(x, y, 4, 0, Math.PI*2);
      dotsCtx.fill();
    }
    dotsCtx.strokeStyle = '#138808';
    dotsCtx.lineWidth = 2;
    const bonesToDraw = [[SHOULDER_L,SHOULDER_R],[SHOULDER_L,ELBOW_L],[ELBOW_L,WRIST_L],[WRIST_L,INDEX_L],[SHOULDER_R,ELBOW_R],[ELBOW_R,WRIST_R],[WRIST_R,INDEX_R],[HIP_L,HIP_R],[HIP_L,KNEE_L],[KNEE_L,ANKLE_L],[HIP_R,KNEE_R],[KNEE_R,ANKLE_R],[SHOULDER_L,HIP_L],[SHOULDER_R,HIP_R],[ANKLE_L,FOOT_INDEX_L],[ANKLE_R,FOOT_INDEX_R]];
    for(const [a,b] of bonesToDraw){
      const la = lastPoseLandmarks[a], lb = lastPoseLandmarks[b];
      if(!la || !lb) continue;
      if((la.visibility!==undefined && la.visibility<POSE_VISIBILITY_MIN) || (lb.visibility!==undefined && lb.visibility<POSE_VISIBILITY_MIN)) continue;
      dotsCtx.beginPath();
      dotsCtx.moveTo(la.x*dotsCanvas.width, la.y*dotsCanvas.height);
      dotsCtx.lineTo(lb.x*dotsCanvas.width, lb.y*dotsCanvas.height);
      dotsCtx.stroke();
    }
  }

  if(lastHandLandmarks && lastHandLandmarks.length){
    for(const hand of lastHandLandmarks){
      dotsCtx.strokeStyle = '#FFFFFF';
      dotsCtx.lineWidth = 1.5;
      for(const [a,b] of HAND_CONNECTIONS){
        const pa = hand[a], pb = hand[b];
        if(!pa || !pb) continue;
        dotsCtx.beginPath();
        dotsCtx.moveTo(pa.x*dotsCanvas.width, pa.y*dotsCanvas.height);
        dotsCtx.lineTo(pb.x*dotsCanvas.width, pb.y*dotsCanvas.height);
        dotsCtx.stroke();
      }
      dotsCtx.fillStyle = '#0b1f6b';
      for(const lm of hand){
        dotsCtx.beginPath();
        dotsCtx.arc(lm.x*dotsCanvas.width, lm.y*dotsCanvas.height, 2.5, 0, Math.PI*2);
        dotsCtx.fill();
      }
    }
  }
}

// Capture now grabs the rendered glCanvas only -- since the background is
// fully virtual (rendered by Three.js, not the camera), there's no need
// to composite the real video frame underneath anymore.
snapBtn.addEventListener('click', ()=>{
  const shot = document.createElement('canvas');
  shot.width = video.videoWidth || glCanvas.width;
  shot.height = video.videoHeight || glCanvas.height;
  const sctx = shot.getContext('2d');
  // Keep the same mirrored orientation the user sees on screen (glCanvas
  // is displayed with CSS scaleX(-1), but its raw pixel buffer is not
  // mirrored, so flip it the same way here).
  sctx.translate(shot.width, 0);
  sctx.scale(-1, 1);
  sctx.drawImage(glCanvas, 0, 0, shot.width, shot.height);
  sctx.setTransform(1,0,0,1,0,0);
  const dataUrl = shot.toDataURL('image/png');
  thumbImg.src = dataUrl;
  thumb.style.display = 'block';
  thumb.onclick = ()=>{
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'gaganyatri-lens-capture.png';
    a.click();
  };
});

recalBtn.addEventListener('click', ()=>{
  smoothedScale = null;
  smoothedStretch = {};
});

flipBtn.addEventListener('click', ()=>{
  flip180 = !flip180;
  flipBtn.classList.toggle('active', flip180);
});

dotsBtn.addEventListener('click', ()=>{
  showDots = !showDots;
  dotsBtn.classList.toggle('active', showDots);
});

poseRetargetBtn.addEventListener('click', ()=>{
  poseRetargetEnabled = !poseRetargetEnabled;
  poseRetargetBtn.classList.toggle('active', poseRetargetEnabled);
});

envBtn.addEventListener('click', ()=>{
  envEnabled = !envEnabled;
  envBtn.classList.toggle('active', envEnabled);
});

function openSheet(){ sheet.classList.add('open'); sheetBackdrop.classList.add('open'); }
function closeSheet(){ sheet.classList.remove('open'); sheetBackdrop.classList.remove('open'); }
settingsBtn.addEventListener('click', openSheet);
sheetBackdrop.addEventListener('click', closeSheet);

window.addEventListener('resize', ()=>{
  if(renderer && video.videoWidth) renderer.setSize(video.videoWidth, video.videoHeight, false);
});
</script>
